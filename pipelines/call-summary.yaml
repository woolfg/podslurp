version: 1

input:
  uses: call-recorder
  with:
    microphone_pattern: Q2U
    system_pattern: 'bluez_output.*\.monitor'
    keep_separate_tracks: true
transcription:
  uses: faster-whisper
  with:
    model: small
    device: cpu
    compute_type: int8
    language: auto
    diarization:
      enabled: false
processing:
  - id: summary
    uses: openai-summary
    with:
      model: gpt-5.6-terra
      reasoning_effort: low
      output_language: auto
      prompt: |
        Summarize the conversation as a concise, factual meeting brief.
        Prioritize the main topics, conclusions, explicit decisions, assigned
        action items, deadlines, and unresolved questions. Merge repeated points
        and omit greetings, small talk, and tangents unless they affect an outcome.
