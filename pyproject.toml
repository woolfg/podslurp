[project]
name = "voxyak"
version = "0.2.0"
description = "Modular audio transcription and processing pipelines"
requires-python = ">=3.10"
dependencies = [
    "faster-whisper>=1.1",
    "openai>=2.0",
    "pydantic>=2.10",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "requests>=2.31",
    "rich>=13",
    "tiktoken>=0.9",
    "tqdm>=4.66",
]

[project.optional-dependencies]
diarize = [
    "pyannote.audio>=3.1",
]

[project.scripts]
voxyak = "voxyak.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["voxyak"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.4",
]

[tool.ruff]
target-version = "py310"
line-length = 88
